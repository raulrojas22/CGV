services:
  shinyproxy:
    image: docker.io/openanalytics/shinyproxy:3.1.1
    container_name: cgv-shinyproxy
    restart: unless-stopped
    user: "0:0"
    networks:
      - sp-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shinyproxy/application.yml:/opt/shinyproxy/application.yml:ro
      - ./.env:/opt/shinyproxy/env/cgv.env:ro
    ports:
      - "127.0.0.1:${SHINYPROXY_PORT:-8080}:8080"
    environment:
      CGV_IMAGE: "${CGV_IMAGE:-cgv:1.1.0}"
      SP_ANNOTATIONS_DIR: "${SP_ANNOTATIONS_DIR:-./annotations}"
      SP_GENOMES_DIR: "${SP_GENOMES_DIR:-./genomes}"
      SP_GO_ANNOTATIONS_DIR: "${SP_GO_ANNOTATIONS_DIR:-./go_annotations}"
      SP_DATA_DIR: "${SP_DATA_DIR:-./data}"
      SP_CACHE_DIR: "${SP_CACHE_DIR:-./cache}"
      SP_NCBI_DOWNLOADS_DIR: "${SP_NCBI_DOWNLOADS_DIR:-./ncbi_downloads}"
      CGV_NCBI_CACHE_MAX_GB: "${CGV_NCBI_CACHE_MAX_GB:-50}"
      CGV_NCBI_USAGE_LOG_ENABLED: "${CGV_NCBI_USAGE_LOG_ENABLED:-true}"
      SP_CONTAINER_MEMORY: "${SP_CONTAINER_MEMORY:-2g}"
      SP_MAX_INSTANCES_PER_USER: "${SP_MAX_INSTANCES_PER_USER:-10}"
      SP_MAX_TOTAL_INSTANCES: "${SP_MAX_TOTAL_INSTANCES:-10}"
      SP_MAX_LIFETIME_MINUTES: "${SP_MAX_LIFETIME_MINUTES:-120}"
      SP_HEARTBEAT_RATE_MS: "${SP_HEARTBEAT_RATE_MS:-30000}"
      SP_APP_PERF_TIMING: "${SP_APP_PERF_TIMING:-1}"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: cgv-nginx
    restart: unless-stopped
    networks:
      - sp-net
    ports:
      - "${CGV_NGINX_PORT:-18080}:80"
    volumes:
      - ./deploy/nginx/cgv-shinyproxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SP_CACHE_DIR:-./cache}:/srv/cgv-cache:ro
    depends_on:
      - shinyproxy

  report-cleaner:
    image: "${CGV_IMAGE:-cgv:1.1.0}"
    restart: unless-stopped
    command: ["sh", "-c", "while true; do Rscript /app/scripts/cleanup_shared_reports.R; sleep 900; done"]
    environment:
      CGV_CACHE_DIR: "/app/cache"
    volumes:
      - ${SP_CACHE_DIR:-./cache}:/app/cache
    networks:
      - sp-net
    healthcheck:
      disable: true

networks:
  sp-net:
    name: sp-net
    driver: bridge
