# CGV reverse proxy for Shiny/httpuv behind Nginx.
# Place the `map` block in the http{} context if your distro does not allow it
# inside an included server file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cgv_shiny {
    server 127.0.0.1:3838;
    keepalive 32;
}

server {
    listen 80;
    server_name cgev.mobilomics.org;

    client_max_body_size 500m;

    # Compress normal HTTP responses. Shiny's live output channel is WebSocket,
    # so app-side payload trimming still matters for large ggiraph widgets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # Enable only when the Nginx Brotli module is installed.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location /shared/ {
        proxy_pass http://cgv_shiny;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf)$ {
        proxy_pass http://cgv_shiny;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://cgv_shiny;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
