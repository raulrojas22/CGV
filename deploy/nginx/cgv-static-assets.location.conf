    # BEGIN CGV IMMUTABLE STATIC v1
    # Each directory is copied from one exact image Id and is never replaced.
    # nginx therefore serves it independently of ShinyProxy session prefixes,
    # with native validators and byte ranges for PDFs and guide videos.
    location ^~ /cgv-static/ {
        alias /srv/cgv-cache/static_assets/releases/;
        autoindex off;
        access_log off;
        log_not_found off;
        etag on;
        disable_symlinks on from=/srv/cgv-cache/static_assets/releases;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # END CGV IMMUTABLE STATIC v1
