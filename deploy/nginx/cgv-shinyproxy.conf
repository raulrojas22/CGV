map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

server {
    listen 80;
    server_name cgev.mobilomics.org _;

    absolute_redirect off;
    # Docker's embedded DNS resolver. The previous Podman-style gateway
    # address does not resolve service names on the sp-net Docker network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cgv_shinyproxy_upstream http://shinyproxy:8080;

    client_max_body_size 500m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    location = / {
        return 302 /app_i/cgv/$request_id/;
    }

    location = /app_direct/cgv {
        return 302 /app_i/cgv/$request_id/;
    }

    location = /app_direct/cgv/ {
        return 302 /app_i/cgv/$request_id/;
    }

    # BEGIN CGV IMMUTABLE STATIC v1
    # Each directory is copied from one exact image Id and is never replaced.
    # nginx therefore serves it independently of ShinyProxy session prefixes,
    # with native validators and byte ranges for PDFs and guide videos.
    location ^~ /cgv-static/ {
        alias /srv/cgv-cache/static_assets/releases/;
        autoindex off;
        access_log off;
        log_not_found off;
        etag on;
        disable_symlinks on from=/srv/cgv-cache/static_assets/releases;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # END CGV IMMUTABLE STATIC v1

    # Immutable CGV reports are served directly from the shared cache. Only
    # public report files are reachable; revocation metadata stays private.
    location ~ "^/share/([a-f0-9]{64})(?:/index[.]html|/?)$" {
        alias /srv/cgv-cache/shared_reports/$1/index.html;
        default_type text/html;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'sha256-EXkIJnQvs/u+7Sw8WFMz21f46Zk6qxolUQbZIaQ9yfg='; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location ~ "^/share/([a-f0-9]{64})/analysis[.]json$" {
        alias /srv/cgv-cache/shared_reports/$1/analysis.json;
        default_type application/json;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/share/([a-f0-9]{64})/downloads/cgv_reproducibility[.]zip$" {
        alias /srv/cgv-cache/shared_reports/$1/downloads/cgv_reproducibility.zip;
        default_type application/zip;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment; filename=cgv_reproducibility.zip" always;
    }

    location /share/ {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass $cgv_shinyproxy_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
    }
}
