services:
  cgv:
    container_name: cgv
    image: ${CGV_IMAGE:-cgv:latest}
    env_file:
      - .env
      - path: .env.local
        required: false
    restart: unless-stopped
    ports:
      - "${CGV_PORT:-3838}:3838"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "3838"
      APP_DEBUG_LOGS: "${APP_DEBUG_LOGS:-0}"
      APP_PERF_TIMING: "${APP_PERF_TIMING:-0}"
      APP_BACKGROUND_REPORTS_ENABLED: "${APP_BACKGROUND_REPORTS_ENABLED:-1}"
      APP_FUTURE_MODE: "${APP_FUTURE_MODE:-multisession}"
      APP_FUTURE_WORKERS: "${APP_FUTURE_WORKERS:-2}"
      APP_SHINY_JSON_DIGITS: "${APP_SHINY_JSON_DIGITS:-12}"
      APP_GIRAFE_COMPACT_SVG: "${APP_GIRAFE_COMPACT_SVG:-1}"
      APP_GIRAFE_SVG_DECIMALS: "${APP_GIRAFE_SVG_DECIMALS:-2}"
      APP_GIRAFE_COMPACT_MIN_BYTES: "${APP_GIRAFE_COMPACT_MIN_BYTES:-2048}"
      APP_ALIGNED_RIBBON_POINTS: "${APP_ALIGNED_RIBBON_POINTS:-25}"
      APP_MULTIPIP_VISUAL_MERGE_FROM: "${APP_MULTIPIP_VISUAL_MERGE_FROM:-350}"
      APP_TRANSPORT_TIMING: "${APP_TRANSPORT_TIMING:-0}"
      APP_TRANSPORT_FLUSH_MS: "${APP_TRANSPORT_FLUSH_MS:-5000}"
      APP_LASTZ_WORKERS: "${APP_LASTZ_WORKERS:-1}"
      APP_LASTZ_GLOBAL_WORKERS: "${APP_LASTZ_GLOBAL_WORKERS:-1}"
      APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS: "${APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS:-1800}"
      APP_LASTZ_CACHE_MAX_ENTRIES: "${APP_LASTZ_CACHE_MAX_ENTRIES:-48}"
      APP_LASTZ_CACHE_MAX_MB: "${APP_LASTZ_CACHE_MAX_MB:-128}"
      APP_LASTZ_DISK_CACHE: "${APP_LASTZ_DISK_CACHE:-1}"
      APP_LASTZ_DISK_CACHE_MAX_MB: "${APP_LASTZ_DISK_CACHE_MAX_MB:-512}"
      APP_LASTZ_DISK_CACHE_TTL_DAYS: "${APP_LASTZ_DISK_CACHE_TTL_DAYS:-30}"
      APP_ORTHO_LOOKUP_PARALLEL: "${APP_ORTHO_LOOKUP_PARALLEL:-1}"
      APP_ORTHO_EXTERNAL_ALIAS: "${APP_ORTHO_EXTERNAL_ALIAS:-1}"
      APP_ORTHO_RENDER_CHUNK_SIZE: "${APP_ORTHO_RENDER_CHUNK_SIZE:-64}"
      APP_ORTHO_AUTO_RENDER_MORE: "${APP_ORTHO_AUTO_RENDER_MORE:-0}"
      APP_ORTHO_AUTO_RENDER_DELAY_MS: "${APP_ORTHO_AUTO_RENDER_DELAY_MS:-0}"
      APP_ORTHO_SERVER_RENDER_NUDGE: "${APP_ORTHO_SERVER_RENDER_NUDGE:-0}"
      APP_HOMO_INITIAL_VISIBLE: "${APP_HOMO_INITIAL_VISIBLE:-64}"
      APP_ORTHO_INITIAL_VISIBLE: "${APP_ORTHO_INITIAL_VISIBLE:-64}"
      APP_ORTHO_SUSPEND_HIDDEN: "${APP_ORTHO_SUSPEND_HIDDEN:-1}"
      APP_GENE_CATALOG_ENABLED: "${APP_GENE_CATALOG_ENABLED:-0}"
      APP_HOMO_DEFER_SEQUENCE: "${APP_HOMO_DEFER_SEQUENCE:-0}"
      APP_ORTHO_DEFER_SEQUENCE: "${APP_ORTHO_DEFER_SEQUENCE:-0}"
      APP_FOOTER_DEFER_SEQUENCE: "${APP_FOOTER_DEFER_SEQUENCE:-0}"
      APP_DEFER_FEATURE_GC: "${APP_DEFER_FEATURE_GC:-0}"
      APP_ORTHO_ALIGNED_FAST: "${APP_ORTHO_ALIGNED_FAST:-1}"
      APP_PREWARM_ON_START: "${APP_PREWARM_ON_START:-1}"
      APP_PREWARM_CLEAN: "${APP_PREWARM_CLEAN:-0}"
      APP_PREWARM_BLOCK_START: "${APP_PREWARM_BLOCK_START:-1}"
      CGV_NCBI_DOWNLOADS_DIR: "/app/ncbi_downloads"
      CGV_NCBI_CACHE_MAX_GB: "${CGV_NCBI_CACHE_MAX_GB:-50}"
      CGV_NCBI_USAGE_LOG_ENABLED: "${CGV_NCBI_USAGE_LOG_ENABLED:-true}"
    volumes:
      - ${CGV_ANNOTATIONS_DIR:-./annotations}:/app/annotations:ro
      - ${CGV_GENOMES_DIR:-./genomes}:/app/genomes:ro
      - ${CGV_GO_ANNOTATIONS_DIR:-./go_annotations}:/app/go_annotations:ro
      - ${CGV_DATA_DIR:-./data}:/app/data:ro
      - ${CGV_CACHE_DIR:-./cache}:/app/cache
      - ${CGV_NCBI_DOWNLOADS_DIR:-./ncbi_downloads}:/app/ncbi_downloads

  background-report-worker:
    image: ${CGV_IMAGE:-cgv:latest}
    env_file:
      - .env
      - path: .env.local
        required: false
    restart: unless-stopped
    command: ["Rscript", "/app/scripts/background_report_worker.R"]
    environment:
      APP_DIR: "/app"
      CGV_DATA_ROOT: "/app"
      CGV_CACHE_DIR: "/app/cache"
      CGV_PUBLIC_BASE_URL: "${CGV_PUBLIC_BASE_URL:-https://cgvapp.com}"
      APP_SHARED_REPORTS_ENABLED: "1"
      APP_BACKGROUND_REPORTS_ENABLED: "${APP_BACKGROUND_REPORTS_ENABLED:-1}"
      APP_LASTZ_GLOBAL_WORKERS: "${APP_LASTZ_GLOBAL_WORKERS:-1}"
      APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS: "${APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS:-1800}"
      CHROMOTE_CHROME: "/usr/bin/google-chrome"
    volumes:
      - ${CGV_ANNOTATIONS_DIR:-./annotations}:/app/annotations:ro
      - ${CGV_GENOMES_DIR:-./genomes}:/app/genomes:ro
      - ${CGV_GO_ANNOTATIONS_DIR:-./go_annotations}:/app/go_annotations:ro
      - ${CGV_DATA_DIR:-./data}:/app/data:ro
      - ${CGV_CACHE_DIR:-./cache}:/app/cache
      - ${CGV_NCBI_DOWNLOADS_DIR:-./ncbi_downloads}:/app/ncbi_downloads
    shm_size: "256mb"
    healthcheck:
      disable: true
